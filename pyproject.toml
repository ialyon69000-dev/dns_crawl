[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-crawl"
version = "1.0.0"
description = "Crawler DNS pour énumérer tous les sites webs référencés sur un DNS / domaine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "dns_crawl"}]
keywords = ["dns", "crawler", "enumeration", "subdomain", "osint", "security"]
dependencies = [
    "dnspython>=2.4.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/ialyon69000-dev/dns_crawl"
Repository = "https://github.com/ialyon69000-dev/dns_crawl"

[project.scripts]
dns-crawl = "dns_crawl.cli:main"
dns_crawl = "dns_crawl.cli:main"

[tool.setuptools.packages.find]
include = ["dns_crawl*"]

[tool.setuptools.package-data]
dns_crawl = ["py.typed"]
